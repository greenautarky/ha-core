name: Build greenautarky HA Core image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag — MUST match HA_VERSION env in this file"
        required: true
        default: "2025.11.3.2"
      force_overwrite:
        description: "Overwrite an already-published release tag on GHCR (only set after explicit operator decision)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - ga/custom-onboarding

env:
  IMAGE: ghcr.io/greenautarky/tinker-homeassistant
  BASE_IMAGE: ghcr.io/home-assistant/armv7-homeassistant-base:2025.10.1
  HA_VERSION: "2025.11.3.2"
  # Base HA version on PyPI (without GA revision suffix) — used by the e2e job
  # to install HA from PyPI. The GA revision (.1, .2 …) is our internal tag only.
  HA_VERSION_PYPI: "2025.11.3"
  FRONTEND_REPO: greenautarky/frontend
  FRONTEND_BRANCH: ga/custom-onboarding

jobs:
  # ---------------------------------------------------------------------------
  # Unit + consistency tests — run first, gate everything else
  # ---------------------------------------------------------------------------
  test:
    name: Run GA component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install test dependencies
        run: |
          uv pip install --system \
            -e . \
            -r requirements_test.txt \
            colorlog \
            "pycares<5" \
            --constraint homeassistant/package_constraints.txt

      - name: Run GA onboarding tests (unit + consistency)
        run: |
          python -m pytest \
            tests/components/greenautarky_onboarding/test_build_consistency.py \
            tests/components/greenautarky_onboarding/test_consent.py \
            tests/components/greenautarky_onboarding/test_version_consistency.py \
            tests/components/greenautarky_onboarding/test_views.py \
            -v --tb=short

      - name: Run GA telemetry tests
        run: |
          python -m pytest tests/components/greenautarky_telemetry/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Build ARM image + frontend wheel
  # Pushes an intermediate :ci-{sha} tag — NOT the final :latest/:landingpage.
  # The push job (below) promotes to final tags only after e2e passes.
  # ---------------------------------------------------------------------------
  build:
    name: Build custom HA Core image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout core
        uses: actions/checkout@v6

      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          path: frontend-build

      - name: Capture frontend commit SHA
        id: frontend-sha
        run: |
          SHA=$(git -C frontend-build rev-parse HEAD)
          SHORT=$(git -C frontend-build rev-parse --short HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Frontend commit: ${SHORT} (${SHA})"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute and inject frontend version
        id: fe-version
        run: |
          # Derive a deterministic, monotonically-increasing PEP 440 version:
          #   YYYYMMDD  — UTC calendar date of the HEAD commit
          #   N         — total commit count on the branch (always increases)
          # Example: 20260320.47
          COMMIT_EPOCH=$(git -C frontend-build log -1 --format='%ct')
          COMMIT_DATE=$(date -u -d "@${COMMIT_EPOCH}" +%Y%m%d)
          COMMIT_COUNT=$(git -C frontend-build rev-list --count HEAD)
          FE_VERSION="${COMMIT_DATE}.${COMMIT_COUNT}"
          echo "version=${FE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed frontend version: ${FE_VERSION}"

          # Inject into pyproject.toml (replaces the 0.0.0.dev0 placeholder)
          sed -i "s/^version\s*=\s*\"0\.0\.0\.dev0\"/version = \"${FE_VERSION}\"/" \
            frontend-build/pyproject.toml
          echo "  pyproject.toml: $(grep '^version' frontend-build/pyproject.toml)"

          # Inject into all 4 pin locations in the core repo
          for FILE in \
            homeassistant/components/frontend/manifest.json \
            homeassistant/package_constraints.txt \
            requirements_all.txt \
            requirements_test_all.txt; do
            sed -i "s/home-assistant-frontend==0\.0\.0\.dev0/home-assistant-frontend==${FE_VERSION}/g" \
              "$FILE"
            echo "  ${FILE}: $(grep 'home-assistant-frontend' "${FILE}")"
          done

      - name: Verify version injection
        run: |
          FE_VERSION="${{ steps.fe-version.outputs.version }}"
          ERRORS=0
          for FILE in \
            homeassistant/components/frontend/manifest.json \
            homeassistant/package_constraints.txt \
            requirements_all.txt \
            requirements_test_all.txt; do
            PINNED=$(grep -oP 'home-assistant-frontend==\K[^\s"]+' "$FILE" || true)
            if [ "$PINNED" != "$FE_VERSION" ]; then
              echo "::error file=$FILE::Injection failed: expected '${FE_VERSION}', got '${PINNED}'"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK: $FILE = ${PINNED}"
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then exit 1; fi

      - name: Install frontend dependencies
        working-directory: frontend-build
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend-build
        run: ./script/build_frontend

      - name: Build frontend wheel
        working-directory: frontend-build
        run: |
          pip install build
          python3 -m build
          cp dist/home_assistant_frontend-*.whl "$GITHUB_WORKSPACE/"

      - name: Verify frontend wheel contains GA pages
        run: |
          WHEEL=$(ls home_assistant_frontend-*.whl)
          echo "Checking wheel: $WHEEL"
          EXPECTED="authorize.html index.html onboarding.html greenautarky-setup.html"
          MISSING=0
          for page in $EXPECTED; do
            if unzip -l "$WHEEL" | grep -q "$page"; then
              echo "  OK: $page found in wheel"
            else
              echo "::error::$page MISSING from frontend wheel!"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required page(s) missing. Check frontend build."
            exit 1
          fi

      - name: Upload frontend wheel (for e2e tests)
        uses: actions/upload-artifact@v4
        with:
          name: ga-frontend-wheel
          path: home_assistant_frontend-*.whl
          retention-days: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine final tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push staging image (:ci-{sha})
        # Pushes an intermediate tag so the promote job can pull it on a
        # different runner. Final :latest/:landingpage tags are set by the
        # promote job only after e2e tests pass.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/arm/v7
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}
            BUILD_ARCH=armv7
          labels: |
            io.hass.version=${{ env.HA_VERSION }}
            io.hass.type=homeassistant
            io.hass.arch=armv7
            io.hass.machine=tinker
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.title=Home Assistant Core (greenautarky)
            org.opencontainers.image.source=https://github.com/greenautarky/ha-core
            org.greenautarky.frontend-version=${{ env.FRONTEND_BRANCH }}@${{ steps.frontend-sha.outputs.short }}
            org.greenautarky.frontend-sha=${{ steps.frontend-sha.outputs.sha }}
            org.greenautarky.frontend-pyversion=${{ steps.fe-version.outputs.version }}
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}

      - name: Verify GA frontend in built image
        run: |
          # Pull with ARM platform explicitly — the image is arm/v7 only
          docker pull --platform linux/arm/v7 ${{ env.IMAGE }}:ci-${{ github.sha }}
          docker create --name verify-fe ${{ env.IMAGE }}:ci-${{ github.sha }} true
          FILE_LIST=$(docker export verify-fe | tar tf -)
          docker rm verify-fe

          ERRORS=0

          if echo "$FILE_LIST" | grep -q "greenautarky-setup.html"; then
            echo "  OK: greenautarky-setup.html found in image"
          else
            echo "::error::BLD-FE-01: greenautarky-setup.html NOT found in image!"
            ERRORS=$((ERRORS + 1))
          fi

          if echo "$FILE_LIST" | grep -qE "greenautarky-setup.*\.js"; then
            echo "  OK: greenautarky-setup JS bundle found in image"
          else
            echo "::error::BLD-FE-02: greenautarky-setup JS bundle NOT found in image!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::GA frontend verification failed."
            exit 1
          fi
          echo "GA frontend verification passed."

  # ---------------------------------------------------------------------------
  # E2E integration tests (Playwright)
  #
  # Installs HA from PyPI with the built GA frontend wheel on a native amd64
  # runner (no QEMU/ARM emulation — keeps tests fast and reliable).
  # Seeds Phase 1 (admin account via stock onboarding API), then drives the
  # full 5-step GA onboarding flow through a real browser.
  #
  # Gates the promote (push) job — if this fails, :latest is NOT updated.
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E — GA onboarding flow (Playwright)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download frontend wheel
        uses: actions/download-artifact@v4
        with:
          name: ga-frontend-wheel

      - name: Install HA with GA frontend wheel
        run: |
          pip install uv
          WHEEL=$(ls home_assistant_frontend-*.whl)

          # Extract the version from the wheel filename so we can patch the
          # core requirements to match.  Without this, HA's runtime dependency
          # check sees "==0.0.0.dev0" in requirements_all.txt / manifest.json,
          # tries to install that non-existent version from PyPI, and the
          # frontend never loads (→ 404 on greenautarky-setup.html).
          FE_VER=$(echo "$WHEEL" | sed -E 's/home_assistant_frontend-([^-]+)-.*/\1/')
          echo "Frontend wheel version: $FE_VER"
          for f in homeassistant/components/frontend/manifest.json \
                   homeassistant/package_constraints.txt \
                   requirements_all.txt \
                   requirements_test_all.txt; do
            sed -i "s/0\.0\.0\.dev0/${FE_VER}/g" "$f"
          done

          # Install from local source (-e .) so GA custom components are available.
          # The PyPI version doesn't include greenautarky_onboarding/telemetry.
          # pycares<5: newer pycares removes ares_query_a_result (breaks aiodns).
          echo "Installing local HA checkout with wheel: $WHEEL"
          uv pip install --system \
            -e . \
            "$WHEEL" \
            "pycares<5"

      - name: Install Playwright + Chromium
        run: |
          cd tests/e2e && npm install
          npx --prefix tests/e2e playwright install chromium --with-deps

      - name: Start HA instance
        run: |
          mkdir -p /tmp/ha-config
          cat > /tmp/ha-config/configuration.yaml << 'HACFG'
          homeassistant:
            name: Test Home
            unit_system: metric
            time_zone: Europe/Berlin
          http:
            server_host: "0.0.0.0"
            server_port: 8123
          logger:
            default: warning
          greenautarky_onboarding:
          greenautarky_telemetry:
          HACFG

          hass -c /tmp/ha-config > /tmp/ha.log 2>&1 &
          echo "HA_PID=$!" >> "$GITHUB_ENV"
          echo "HA started (PID $!)"

      - name: Wait for HA to be ready
        run: |
          echo "Waiting for HA to start..."
          for i in $(seq 1 90); do
            # curl returns exit 7 (connection refused) when HA is not up yet.
            # Capture HTTP code separately to avoid || echo "000" appending to
            # curl's own "000" output (which would produce "000000" != "000").
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                   --connect-timeout 2 http://localhost:8123/api/ 2>/dev/null) || HTTP="000"
            if [ "${HTTP}" != "000" ]; then
              echo "HA responded HTTP ${HTTP} after ${i}×2s"
              break
            fi
            [ "$i" -eq 90 ] && { echo "::error::HA never started"; cat /tmp/ha.log; exit 1; }
            sleep 2
          done

      - name: Complete stock onboarding (Phase 1 — create admin account)
        run: |
          # Create admin user via stock HA onboarding API (unauthenticated)
          CREATE=$(curl -sf -X POST http://localhost:8123/api/onboarding/users \
            -H "Content-Type: application/json" \
            -d '{
              "client_id": "http://localhost:8123/",
              "name": "Admin",
              "username": "admin",
              "password": "changeme",
              "language": "en"
            }')
          echo "Create user: $CREATE"
          AUTH_CODE=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['auth_code'])")

          # Exchange auth code for Bearer token
          TOKEN=$(curl -sf -X POST http://localhost:8123/auth/token \
            -d "grant_type=authorization_code&code=${AUTH_CODE}&client_id=http://localhost:8123/")
          ADMIN_TOKEN=$(echo "$TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"

          # Complete remaining stock onboarding steps (core_config, analytics, integration)
          for STEP in core_config analytics integration; do
            curl -sf -X POST "http://localhost:8123/api/onboarding/${STEP}" \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"client_id":"http://localhost:8123/"}' 2>/dev/null || true
          done
          echo "Phase 1 (stock onboarding) complete."

      - name: Verify GA onboarding page accessible
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -L http://localhost:8123/greenautarky-setup.html)
          echo "GA onboarding page: HTTP $HTTP"
          [ "$HTTP" = "200" ] || { echo "::error::GA onboarding page not accessible (HTTP $HTTP)"; exit 1; }

      - name: Run Playwright e2e tests
        env:
          HA_BASE_URL: "http://localhost:8123"
          HA_USERNAME: "admin"
          HA_PASSWORD: "changeme"
        run: |
          npx --prefix tests/e2e playwright test --config tests/e2e/playwright.config.ts

      - name: Show HA log on failure
        if: failure()
        run: tail -100 /tmp/ha.log || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/artifacts/
            tests/e2e/report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Promote staging image to final tags
  # Only runs on workflow_dispatch (manual release trigger).
  # On push events, the :ci-{sha} staging tag remains — no release tags are
  # set. This ensures :2025.11.3.1 and :latest are only updated when
  # explicitly intended, keeping releases reproducible and stable.json
  # consistent.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote image to final tags
    runs-on: ubuntu-latest
    needs: [build, test-e2e]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate requested tag matches HA_VERSION env
        # Forces explicit bump-then-promote: operator must edit HA_VERSION in
        # this file (and push) BEFORE triggering a release build with a new
        # tag. Mirrors the supervisor's const.py validation. Catches the
        # "promote with default 2025.11.3.1 by accident" trap.
        run: |
          REQUESTED="${{ github.event.inputs.tag }}"
          DECLARED="${{ env.HA_VERSION }}"
          if [ "$REQUESTED" != "$DECLARED" ]; then
            echo "::error::Requested tag '${REQUESTED}' does not match HA_VERSION env '${DECLARED}'"
            echo "::error::Bump HA_VERSION in .github/workflows/build-ga-core.yml first, push,"
            echo "::error::then re-trigger this workflow with tag=${DECLARED}."
            exit 1
          fi
          echo "OK: tag (${REQUESTED}) == HA_VERSION (${DECLARED})"

      - name: Check whether release tag already exists on GHCR
        # Release tags are intended to be immutable once promoted (rollback
        # path). Re-running the workflow with the same tag would silently
        # overwrite the published image. Refuse unless force_overwrite=true.
        id: existing
        run: |
          TAG="${{ github.event.inputs.tag }}"
          FORCE="${{ github.event.inputs.force_overwrite }}"
          # docker manifest inspect exits 1 (and writes an error to stderr)
          # when the tag is absent — that's the success case here.
          if docker manifest inspect "${{ env.IMAGE }}:${TAG}" >/dev/null 2>&1; then
            EXISTS=1
            echo "Tag ${{ env.IMAGE }}:${TAG} already exists on GHCR."
          else
            EXISTS=0
            echo "Tag ${{ env.IMAGE }}:${TAG} is new — safe to publish."
          fi
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

          if [ "$EXISTS" = "1" ] && [ "$FORCE" != "true" ]; then
            echo "::error::Refusing to overwrite published release tag ${{ env.IMAGE }}:${TAG}."
            echo "::error::If this is intentional (e.g. rebuild a withdrawn release), re-trigger"
            echo "::error::with force_overwrite=true. Otherwise bump HA_VERSION first."
            exit 1
          fi

      - name: Pull staging image and promote to final tags
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Promoting ci-${{ github.sha }} → :${TAG} :latest :landingpage :${{ env.HA_VERSION }}"

          docker pull --platform linux/arm/v7 ${{ env.IMAGE }}:ci-${{ github.sha }}

          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:${TAG}
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:landingpage
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:${{ env.HA_VERSION }}

          docker push ${{ env.IMAGE }}:${TAG}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:landingpage
          docker push ${{ env.IMAGE }}:${{ env.HA_VERSION }}

          echo "Image promoted to final tags."
          echo "  :${TAG}"
          echo "  :latest"
          echo "  :landingpage"
          echo "  :${{ env.HA_VERSION }}"
