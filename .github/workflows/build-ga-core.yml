name: Build greenautarky HA Core image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 2025.11.0-ga.1)"
        required: true
        default: "2025.11.0-ga.1"
  push:
    branches:
      - ga/custom-onboarding

env:
  IMAGE: ghcr.io/greenautarky/tinker-homeassistant
  BASE_IMAGE: ghcr.io/home-assistant/armv7-homeassistant-base:2025.10.1
  FRONTEND_REPO: greenautarky/frontend
  FRONTEND_BRANCH: ga/custom-onboarding

jobs:
  build:
    name: Build and push custom HA Core
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          path: frontend-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install frontend dependencies
        working-directory: frontend-build
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend-build
        run: ./script/build_frontend

      - name: Build frontend wheel
        working-directory: frontend-build
        run: |
          pip install build
          python3 -m build
          cp dist/home_assistant_frontend-*.whl "$GITHUB_WORKSPACE/"

      - name: Verify frontend wheel
        run: ls -la home_assistant_frontend-*.whl

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/arm/v7
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}
            BUILD_ARCH=armv7
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
