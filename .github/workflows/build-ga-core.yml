name: Build greenautarky HA Core image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 2025.11.3.1)"
        required: true
        default: "2025.11.3.1"
  push:
    branches:
      - ga/custom-onboarding

env:
  IMAGE: ghcr.io/greenautarky/tinker-homeassistant
  BASE_IMAGE: ghcr.io/home-assistant/armv7-homeassistant-base:2025.10.1
  HA_VERSION: "2025.11.3.1"
  # Base HA version on PyPI (without GA revision suffix) — used by the e2e job
  # to install HA from PyPI. The GA revision (.1, .2 …) is our internal tag only.
  HA_VERSION_PYPI: "2025.11.3"
  FRONTEND_REPO: greenautarky/frontend
  FRONTEND_BRANCH: ga/custom-onboarding

jobs:
  # ---------------------------------------------------------------------------
  # Unit + consistency tests — run first, gate everything else
  # ---------------------------------------------------------------------------
  test:
    name: Run GA component tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install test dependencies
        run: |
          uv pip install --system \
            -e . \
            -r requirements_test.txt \
            colorlog \
            "pycares<5" \
            --constraint homeassistant/package_constraints.txt

      - name: Run GA onboarding tests (unit + consistency)
        run: |
          python -m pytest \
            tests/components/greenautarky_onboarding/test_build_consistency.py \
            tests/components/greenautarky_onboarding/test_consent.py \
            tests/components/greenautarky_onboarding/test_version_consistency.py \
            tests/components/greenautarky_onboarding/test_views.py \
            -v --tb=short

      - name: Run GA telemetry tests
        run: |
          python -m pytest tests/components/greenautarky_telemetry/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Build ARM image + frontend wheel
  # Pushes an intermediate :ci-{sha} tag — NOT the final :latest/:landingpage.
  # The push job (below) promotes to final tags only after e2e passes.
  # ---------------------------------------------------------------------------
  build:
    name: Build custom HA Core image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          path: frontend-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify frontend version consistency
        run: |
          FE_VERSION=$(grep -oP '^version\s*=\s*"\K[^"]+' frontend-build/pyproject.toml)
          echo "Frontend version: $FE_VERSION"
          ERRORS=0
          for FILE in \
            homeassistant/components/frontend/manifest.json \
            homeassistant/package_constraints.txt \
            requirements_all.txt \
            requirements_test_all.txt; do
            PINNED=$(grep -oP 'home-assistant-frontend==\K[^\s"]+' "$FILE" || true)
            if [ "$PINNED" != "$FE_VERSION" ]; then
              echo "::error file=$FILE::Version mismatch: $FILE has '$PINNED', expected '$FE_VERSION'"
              ERRORS=$((ERRORS + 1))
            else
              echo "  OK: $FILE matches ($PINNED)"
            fi
          done
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Frontend version mismatch in $ERRORS file(s). Update all 5 locations to '$FE_VERSION'."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend-build
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend-build
        run: ./script/build_frontend

      - name: Build frontend wheel
        working-directory: frontend-build
        run: |
          pip install build
          python3 -m build
          cp dist/home_assistant_frontend-*.whl "$GITHUB_WORKSPACE/"

      - name: Verify frontend wheel contains GA pages
        run: |
          WHEEL=$(ls home_assistant_frontend-*.whl)
          echo "Checking wheel: $WHEEL"
          EXPECTED="authorize.html index.html onboarding.html greenautarky-setup.html"
          MISSING=0
          for page in $EXPECTED; do
            if unzip -l "$WHEEL" | grep -q "$page"; then
              echo "  OK: $page found in wheel"
            else
              echo "::error::$page MISSING from frontend wheel!"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required page(s) missing. Check frontend build."
            exit 1
          fi

      - name: Upload frontend wheel (for e2e tests)
        uses: actions/upload-artifact@v4
        with:
          name: ga-frontend-wheel
          path: home_assistant_frontend-*.whl
          retention-days: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine final tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push staging image (:ci-{sha})
        # Pushes an intermediate tag so the promote job can pull it on a
        # different runner. Final :latest/:landingpage tags are set by the
        # promote job only after e2e tests pass.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/arm/v7
          build-args: |
            BUILD_FROM=${{ env.BASE_IMAGE }}
            BUILD_ARCH=armv7
          labels: |
            io.hass.version=${{ env.HA_VERSION }}
            io.hass.type=homeassistant
            io.hass.arch=armv7
            io.hass.machine=tinker
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.title=Home Assistant Core (greenautarky)
            org.opencontainers.image.source=https://github.com/greenautarky/ha-core
          tags: ${{ env.IMAGE }}:ci-${{ github.sha }}

      - name: Verify GA frontend in built image
        run: |
          # Pull with ARM platform explicitly — the image is arm/v7 only
          docker pull --platform linux/arm/v7 ${{ env.IMAGE }}:ci-${{ github.sha }}
          docker create --name verify-fe ${{ env.IMAGE }}:ci-${{ github.sha }} true
          FILE_LIST=$(docker export verify-fe | tar tf -)
          docker rm verify-fe

          ERRORS=0

          if echo "$FILE_LIST" | grep -q "greenautarky-setup.html"; then
            echo "  OK: greenautarky-setup.html found in image"
          else
            echo "::error::BLD-FE-01: greenautarky-setup.html NOT found in image!"
            ERRORS=$((ERRORS + 1))
          fi

          if echo "$FILE_LIST" | grep -qE "greenautarky-setup.*\.js"; then
            echo "  OK: greenautarky-setup JS bundle found in image"
          else
            echo "::error::BLD-FE-02: greenautarky-setup JS bundle NOT found in image!"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::GA frontend verification failed."
            exit 1
          fi
          echo "GA frontend verification passed."

  # ---------------------------------------------------------------------------
  # E2E integration tests (Playwright)
  #
  # Installs HA from PyPI with the built GA frontend wheel on a native amd64
  # runner (no QEMU/ARM emulation — keeps tests fast and reliable).
  # Seeds Phase 1 (admin account via stock onboarding API), then drives the
  # full 5-step GA onboarding flow through a real browser.
  #
  # Gates the promote (push) job — if this fails, :latest is NOT updated.
  # ---------------------------------------------------------------------------
  test-e2e:
    name: E2E — GA onboarding flow (Playwright)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download frontend wheel
        uses: actions/download-artifact@v4
        with:
          name: ga-frontend-wheel

      - name: Install HA with GA frontend wheel
        run: |
          pip install uv
          WHEEL=$(ls home_assistant_frontend-*.whl)
          # Use HA_VERSION_PYPI (base version without GA revision) — PyPI only
          # has upstream versions like 2025.11.3, not our 2025.11.3.1 tags.
          # No --constraint flag: package_constraints.txt is for the Docker image
          # build only. The e2e test just needs a working HA instance.
          echo "Installing HA ${{ env.HA_VERSION_PYPI }} with wheel: $WHEEL"
          uv pip install --system \
            "homeassistant==${{ env.HA_VERSION_PYPI }}" \
            "$WHEEL"

      - name: Install Playwright + Chromium
        run: |
          npm install -g @playwright/test@^1.50.0
          npx playwright install chromium --with-deps

      - name: Start HA instance
        run: |
          mkdir -p /tmp/ha-config
          cat > /tmp/ha-config/configuration.yaml << 'HACFG'
          homeassistant:
            name: Test Home
            unit_system: metric
            time_zone: Europe/Berlin
          http:
            server_host: "0.0.0.0"
            server_port: 8123
          logger:
            default: warning
          HACFG

          hass -c /tmp/ha-config > /tmp/ha.log 2>&1 &
          echo "HA_PID=$!" >> "$GITHUB_ENV"
          echo "HA started (PID $!)"

      - name: Wait for HA to be ready
        run: |
          echo "Waiting for HA to start..."
          for i in $(seq 1 90); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                   --connect-timeout 2 http://localhost:8123/api/ 2>/dev/null || echo "000")
            if [ "$HTTP" != "000" ]; then
              echo "HA responded HTTP $HTTP after ${i}×2s"
              break
            fi
            [ "$i" -eq 90 ] && { echo "::error::HA never started"; cat /tmp/ha.log; exit 1; }
            sleep 2
          done

      - name: Complete stock onboarding (Phase 1 — create admin account)
        run: |
          # Create admin user via stock HA onboarding API (unauthenticated)
          CREATE=$(curl -sf -X POST http://localhost:8123/api/onboarding/users \
            -H "Content-Type: application/json" \
            -d '{
              "client_id": "http://localhost:8123/",
              "name": "Admin",
              "username": "admin",
              "password": "changeme",
              "language": "en"
            }')
          echo "Create user: $CREATE"
          AUTH_CODE=$(echo "$CREATE" | python3 -c "import sys,json; print(json.load(sys.stdin)['auth_code'])")

          # Exchange auth code for Bearer token
          TOKEN=$(curl -sf -X POST http://localhost:8123/auth/token \
            -d "grant_type=authorization_code&code=${AUTH_CODE}&client_id=http://localhost:8123/")
          ADMIN_TOKEN=$(echo "$TOKEN" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          echo "ADMIN_TOKEN=$ADMIN_TOKEN" >> "$GITHUB_ENV"

          # Complete remaining stock onboarding steps (core_config, analytics, integration)
          for STEP in core_config analytics integration; do
            curl -sf -X POST "http://localhost:8123/api/onboarding/${STEP}" \
              -H "Authorization: Bearer $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"client_id":"http://localhost:8123/"}' 2>/dev/null || true
          done
          echo "Phase 1 (stock onboarding) complete."

      - name: Verify GA onboarding page accessible
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" -L http://localhost:8123/greenautarky-setup.html)
          echo "GA onboarding page: HTTP $HTTP"
          [ "$HTTP" = "200" ] || { echo "::error::GA onboarding page not accessible (HTTP $HTTP)"; exit 1; }

      - name: Run Playwright e2e tests
        env:
          HA_BASE_URL: "http://localhost:8123"
          HA_USERNAME: "admin"
          HA_PASSWORD: "changeme"
        run: |
          npx playwright test --config tests/e2e/playwright.config.ts

      - name: Show HA log on failure
        if: failure()
        run: tail -100 /tmp/ha.log || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/e2e/artifacts/
            tests/e2e/report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Promote staging image to final tags
  # Only runs when BOTH build AND test-e2e succeed.
  # This ensures :latest is never updated with a broken build.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote image to final tags
    runs-on: ubuntu-latest
    needs: [build, test-e2e]
    permissions:
      packages: write

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine final tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull staging image and promote to final tags
        run: |
          docker pull --platform linux/arm/v7 ${{ env.IMAGE }}:ci-${{ github.sha }}

          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:landingpage
          docker tag ${{ env.IMAGE }}:ci-${{ github.sha }} ${{ env.IMAGE }}:${{ env.HA_VERSION }}

          docker push ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:landingpage
          docker push ${{ env.IMAGE }}:${{ env.HA_VERSION }}

          echo "Image promoted to final tags."
          echo "  :${{ steps.tag.outputs.tag }}"
          echo "  :latest"
          echo "  :landingpage"
          echo "  :${{ env.HA_VERSION }}"
