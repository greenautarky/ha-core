<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>greenautarky KI-Butler — Einrichtung</title>
<style>
  :root {
    --ga-primary: #2B5A2A;
    --ga-primary-light: #3D7B3B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    color: #212121;
    background: #fafafa;
    min-height: 100vh;
  }
  .progress-bar {
    position: fixed; top: 0; left: 0; width: 100%; height: 4px;
    background: #e0e0e0; z-index: 10;
  }
  .progress-fill {
    height: 100%; background: var(--ga-primary);
    transition: width 0.3s ease;
  }
  .container { max-width: 480px; margin: 0 auto; padding: 48px 24px; }
  .card {
    background: #fff; border-radius: 16px; padding: 32px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .brand-block { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .ga-logo { width: 64px; height: 64px; }
  .ha-logo { width: 40px; height: 40px; }
  .brand-tagline { font-size: 13px; color: #5a5a5a; margin: 8px 0 0 0; }
  .brand-tagline strong { color: var(--ga-primary); }
  h1 { color: var(--ga-primary); font-size: 1.5rem; margin: 0 0 8px 0; }
  h2 { color: var(--ga-primary); font-size: 1.1rem; margin: 24px 0 8px 0; }
  h2:first-of-type { margin-top: 16px; }
  p { line-height: 1.5; margin: 8px 0; }
  .step-indicator { font-size: 13px; color: #888; margin-bottom: 16px; }
  .btn-primary {
    display: block; width: 100%; padding: 12px 24px; margin-top: 24px;
    background: var(--ga-primary); color: white; border: none;
    border-radius: 8px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  .btn-primary:hover { background: var(--ga-primary-light); }
  .btn-primary:disabled { background: #999; cursor: not-allowed; }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid #eee;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-label { flex: 1; }
  .toggle-label .heading { font-weight: 500; font-size: 14px; }
  .toggle-label .description { font-size: 12px; color: #888; margin-top: 2px; }
  .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; margin-left: 16px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc; border-radius: 28px; transition: 0.3s;
  }
  .slider:before {
    content: ""; position: absolute; height: 22px; width: 22px;
    left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s;
  }
  input:checked + .slider { background: var(--ga-primary); }
  input:checked + .slider:before { transform: translateX(20px); }
  ul { padding-left: 20px; margin: 8px 0; }
  li { margin-bottom: 4px; line-height: 1.4; }
  a { color: var(--ga-primary-light); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .gdpr-text {
    max-height: 200px; overflow-y: auto; padding: 12px;
    background: #f5f5f5; border-radius: 8px; font-size: 13px;
    line-height: 1.6; margin: 16px 0;
  }
  .form-field { margin-bottom: 16px; }
  .form-field label {
    display: block; font-size: 13px; font-weight: 500;
    margin-bottom: 4px; color: #555;
  }
  .form-field input {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc;
    border-radius: 8px; font-size: 15px; font-family: inherit;
  }
  .form-field input:focus {
    outline: none; border-color: var(--ga-primary);
    box-shadow: 0 0 0 2px rgba(43,90,42,0.15);
  }
  .error { color: #d32f2f; font-size: 13px; margin-top: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

<div class="container">
  <div class="card">
    <div class="brand-block">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="ga-logo">
        <circle cx="100" cy="100" r="90" fill="#2B5A2A"/>
        <text x="100" y="115" text-anchor="middle" fill="white"
              font-size="48" font-weight="bold" font-family="Arial,sans-serif">GA</text>
      </svg>
      <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" class="ha-logo">
        <path fill="#18BCF2" d="M240 224.762a15 15 0 0 1-15 15H15a15 15 0 0 1-15-15v-90c0-8.25 4.77-19.769 10.61-25.609l98.78-98.7805c5.83-5.83 15.38-5.83 21.21 0l98.79 98.7895c5.83 5.83 10.61 17.36 10.61 25.61v90-.01Z"/>
        <path fill="#F2F4F9" d="m107.27 239.762-40.63-40.63c-2.09.72-4.32 1.13-6.64 1.13-11.3 0-20.5-9.2-20.5-20.5s9.2-20.5 20.5-20.5 20.5 9.2 20.5 20.5c0 2.33-.41 4.56-1.13 6.65l31.63 31.63v-115.88c-6.8-3.34-11.5-10.32-11.5-18.39 0-11.3 9.2-20.5 20.5-20.5s20.5 9.2 20.5 20.5c0 8.07-4.7 15.05-11.5 18.39v81.27l31.46-31.46c-.62-1.96-.96-4.04-.96-6.2 0-11.3 9.2-20.5 20.5-20.5s20.5 9.2 20.5 20.5-9.2 20.5-20.5 20.5c-2.5 0-4.88-.47-7.09-1.29L129 208.892v30.88z"/>
      </svg>
    </div>
    <p class="brand-tagline">
      <strong>greenautarky KI-Butler</strong> powered by Home Assistant
    </p>

    <div id="wizard"></div>
  </div>
</div>

<script>
(function() {
  let step = "gdpr";
  let tenantMode = false;
  let telemetryPrefs = { error_logs: true, metrics: true };
  let tenantData = { name: "", username: "", password: "", password2: "" };
  let error = "";

  function getSteps() {
    return tenantMode
      ? ["account", "gdpr", "telemetry", "info"]
      : ["gdpr", "telemetry", "info"];
  }

  function currentStepNum() {
    const steps = getSteps();
    const idx = steps.indexOf(step);
    return idx >= 0 ? idx + 1 : 1;
  }

  async function apiPost(endpoint, data) {
    const resp = await fetch("/api/greenautarky_onboarding/" + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data),
    });
    return resp.json();
  }

  async function checkStatus() {
    try {
      const resp = await fetch("/api/greenautarky_onboarding/status");
      const state = await resp.json();
      if (state.completed) {
        window.location.href = "/";
        return;
      }
      tenantMode = !!state.tenant_mode;
      const done = state.steps_done || [];
      if (done.includes("telemetry")) step = "info";
      else if (done.includes("gdpr")) step = "telemetry";
      else if (done.includes("account") || !tenantMode) step = "gdpr";
      else step = "account";
    } catch (e) { /* start from beginning */ }
    render();
  }

  async function createAccount() {
    error = "";
    if (!tenantData.name || !tenantData.username || !tenantData.password) {
      error = "Bitte alle Felder ausfuellen.";
      render(); return;
    }
    if (tenantData.password !== tenantData.password2) {
      error = "Die Passwoerter stimmen nicht ueberein.";
      render(); return;
    }
    if (tenantData.password.length < 6) {
      error = "Das Passwort muss mindestens 6 Zeichen lang sein.";
      render(); return;
    }
    const result = await apiPost("create_tenant", {
      name: tenantData.name,
      username: tenantData.username,
      password: tenantData.password,
    });
    if (result.status === "ok") {
      step = "gdpr"; render();
    } else {
      error = result.message || "Fehler beim Erstellen des Kontos.";
      render();
    }
  }

  async function acceptGDPR() {
    await apiPost("gdpr", { accepted: true });
    step = "telemetry"; render();
  }

  async function saveTelemetry() {
    await apiPost("telemetry", telemetryPrefs);
    step = "info"; render();
  }

  async function complete() {
    const result = await apiPost("complete", {});
    if (result.redirect) window.location.href = result.redirect;
  }

  function render() {
    const steps = getSteps();
    const total = steps.length;
    const num = currentStepNum();
    document.getElementById("progress").style.width = ((num / total) * 100) + "%";

    const wizard = document.getElementById("wizard");
    let html = "";

    if (step === "account") {
      html = '<div class="step-indicator">Schritt ' + num + ' von ' + total + '</div>' +
        '<h1>Konto erstellen</h1>' +
        '<p>Erstelle dein persoenliches Benutzerkonto fuer den KI-Butler.</p>' +
        '<div class="form-field"><label for="acc-name">Anzeigename</label>' +
        '<input type="text" id="acc-name" placeholder="z.B. Max Mustermann" value="' + esc(tenantData.name) + '"></div>' +
        '<div class="form-field"><label for="acc-username">Benutzername</label>' +
        '<input type="text" id="acc-username" placeholder="z.B. max" value="' + esc(tenantData.username) + '" autocapitalize="none"></div>' +
        '<div class="form-field"><label for="acc-password">Passwort</label>' +
        '<input type="password" id="acc-password" placeholder="Mindestens 6 Zeichen"></div>' +
        '<div class="form-field"><label for="acc-password2">Passwort wiederholen</label>' +
        '<input type="password" id="acc-password2" placeholder="Passwort bestaetigen"></div>' +
        (error ? '<div class="error">' + esc(error) + '</div>' : '') +
        '<button class="btn-primary" id="btn-create-account">Konto erstellen</button>';
    }
    else if (step === "gdpr") {
      html = '<div class="step-indicator">Schritt ' + num + ' von ' + total + '</div>' +
        '<h1>Datenschutz</h1>' +
        '<p>Bevor wir starten, brauchen wir deine Zustimmung zur Datenverarbeitung.</p>' +
        '<div class="gdpr-text">' +
        '<strong>Datenschutzerklaerung</strong><br><br>' +
        'Dein greenautarky KI-Butler verarbeitet personenbezogene Daten ' +
        'ausschliesslich lokal auf diesem Geraet. Es werden keine Daten an ' +
        'Dritte weitergegeben, es sei denn, du aktivierst dies ausdruecklich ' +
        '(z.B. Cloud-Integrationen oder Telemetrie).<br><br>' +
        '<strong>Welche Daten werden verarbeitet?</strong>' +
        '<ul><li>Geraetezustaende und Automatisierungen (lokal gespeichert)</li>' +
        '<li>Benutzerkonto-Informationen (Name, Anmeldedaten)</li>' +
        '<li>Optionale Telemetriedaten (nur mit deiner Zustimmung)</li></ul>' +
        '<strong>Deine Rechte:</strong>' +
        '<ul><li>Auskunft ueber gespeicherte Daten</li>' +
        '<li>Loeschung deines Kontos und aller Daten</li>' +
        '<li>Widerruf der Telemetrie-Zustimmung jederzeit</li></ul>' +
        'Weitere Informationen findest du auf ' +
        '<a href="https://greenautarky.com/datenschutz" target="_blank" rel="noreferrer">greenautarky.com/datenschutz</a>.' +
        '</div>' +
        '<button class="btn-primary" id="btn-accept-gdpr">Ich stimme zu und moechte fortfahren</button>';
    }
    else if (step === "telemetry") {
      html = '<div class="step-indicator">Schritt ' + num + ' von ' + total + '</div>' +
        '<h1>Telemetrie</h1>' +
        '<p>Hilf uns, deinen KI-Butler zu verbessern. Du kannst diese Einstellungen ' +
        'jederzeit unter <strong>Einstellungen</strong> aendern.</p>' +
        '<div class="toggle-row"><div class="toggle-label">' +
        '<div class="heading">Fehlerberichte</div>' +
        '<div class="description">Fehlerprotokolle an greenautarky senden</div></div>' +
        '<label class="switch"><input type="checkbox" id="tel-errors"' + (telemetryPrefs.error_logs ? ' checked' : '') + '>' +
        '<span class="slider"></span></label></div>' +
        '<div class="toggle-row"><div class="toggle-label">' +
        '<div class="heading">Metriken</div>' +
        '<div class="description">Systemmetriken an greenautarky senden</div></div>' +
        '<label class="switch"><input type="checkbox" id="tel-metrics"' + (telemetryPrefs.metrics ? ' checked' : '') + '>' +
        '<span class="slider"></span></label></div>' +
        '<button class="btn-primary" id="btn-save-telemetry">Weiter</button>';
    }
    else if (step === "info") {
      html = '<div class="step-indicator">Schritt ' + num + ' von ' + total + '</div>' +
        '<h1>Ueber deinen KI-Butler</h1>' +
        '<p>Dein KI-Butler ist ein lokaler Smart-Home-Hub, der deine Daten schuetzt. ' +
        'Er unterstuetzt Zigbee-, WLAN- und Ethernet-Geraete.</p>' +
        '<ul><li>Alle Automatisierungen laufen lokal auf dem Geraet</li>' +
        '<li>Keine Cloud-Abhaengigkeit erforderlich</li>' +
        '<li>Erweiterbar mit Add-ons und Integrationen</li></ul>' +
        '<h2>Erste Schritte</h2><p>Nach der Einrichtung kannst du:</p>' +
        '<ul><li>Smart-Geraete hinzufuegen unter <strong>Einstellungen &gt; Geraete</strong></li>' +
        '<li>Automatisierungen erstellen unter <strong>Einstellungen &gt; Automatisierungen</strong></li>' +
        '<li>Add-ons installieren unter <strong>Einstellungen &gt; Add-ons</strong></li>' +
        '<li>Dein Dashboard auf der Uebersichtsseite anpassen</li></ul>' +
        '<h2>Lade die App herunter</h2>' +
        '<p>Steuere dein Zuhause von unterwegs mit der Home Assistant App:</p>' +
        '<ul><li><a href="https://play.google.com/store/apps/details?id=io.homeassistant.companion.android" target="_blank" rel="noreferrer">Google Play Store</a></li>' +
        '<li><a href="https://apps.apple.com/app/home-assistant/id1099568401" target="_blank" rel="noreferrer">Apple App Store</a></li></ul>' +
        '<h2>Hilfe benoetigt?</h2>' +
        '<p>Besuche die Dokumentation auf ' +
        '<a href="https://www.home-assistant.io/docs/" target="_blank" rel="noreferrer">home-assistant.io/docs</a> ' +
        'oder wende dich an die Community-Foren.</p>' +
        '<button class="btn-primary" id="btn-complete">Einrichtung abschliessen</button>';
    }

    wizard.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    bind("acc-name", "input", function(e) { tenantData.name = e.target.value; });
    bind("acc-username", "input", function(e) { tenantData.username = e.target.value; });
    bind("acc-password", "input", function(e) { tenantData.password = e.target.value; });
    bind("acc-password2", "input", function(e) { tenantData.password2 = e.target.value; });
    bind("btn-create-account", "click", createAccount);
    bind("btn-accept-gdpr", "click", acceptGDPR);
    bind("tel-errors", "change", function(e) { telemetryPrefs.error_logs = e.target.checked; });
    bind("tel-metrics", "change", function(e) { telemetryPrefs.metrics = e.target.checked; });
    bind("btn-save-telemetry", "click", saveTelemetry);
    bind("btn-complete", "click", complete);
  }

  function bind(id, evt, fn) {
    var el = document.getElementById(id);
    if (el) el.addEventListener(evt, fn);
  }

  function esc(s) {
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  checkStatus();
})();
</script>
</body>
</html>
